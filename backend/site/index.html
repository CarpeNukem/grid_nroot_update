<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!--
			Unlisted, not hidden. The venue shares this link with its own guests; it
			is not meant to be found by searching a staff member's character name.
			The Worker sends X-Robots-Tag alongside this tag, and that is the one
			that also covers the JSON and the images, which no meta tag can reach.
		-->
		<meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />

		<title>The Grid</title>
		<meta name="description" content="The Grid's cyberdeck, in a browser." />

		<style>
			/*
				The plugin's default theme, transcribed from CyberdeckTheme.cs so the
				browser build and the in-game one read as the same device.
			*/
			:root {
				--bg: #071017;
				--panel: #0b1820;
				--raised: #102630;
				--cyan: #31e6df;
				--magenta: #ff3eb5;
				--amber: #ffc857;
				--error: #ff5c6c;
				--text: #d5fbf7;
				--muted: #79aaa7;
				--line: #236669;
				--font: "Segoe UI", system-ui, -apple-system, sans-serif;
				--mono: "Cascadia Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				background: #02070a;
				color: var(--text);
				font-family: var(--font);
				line-height: 1.55;
			}

			body {
				min-height: 100vh;
				padding: clamp(0px, 3vw, 2.5rem) clamp(0px, 2vw, 1.5rem);
				display: flex;
				justify-content: center;
				align-items: flex-start;
			}

			/* ---- the device ---- */

			.deck {
				width: 100%;
				max-width: 46rem;
				background: var(--bg);
				border: 1px solid var(--line);
				border-radius: 8px;
				box-shadow:
					0 0 0 1px rgba(49, 230, 223, 0.12),
					0 0 40px rgba(49, 230, 223, 0.09),
					0 18px 50px rgba(0, 0, 0, 0.7);
				overflow: hidden;
				position: relative;
			}

			/* Scanlines over the whole device, never over the content's hit area. */
			.deck::after {
				content: "";
				position: absolute;
				inset: 0;
				pointer-events: none;
				background: repeating-linear-gradient(
					to bottom,
					rgba(49, 230, 223, 0.035) 0 1px,
					transparent 1px 3px
				);
			}

			.deck-bar,
			.deck-foot {
				display: flex;
				align-items: center;
				gap: 0.6rem;
				padding: 0.55rem 0.9rem;
				background: var(--panel);
				font-family: var(--mono);
				font-size: 0.68rem;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--muted);
			}

			.deck-bar {
				border-bottom: 1px solid var(--line);
			}

			.deck-foot {
				border-top: 1px solid var(--line);
				justify-content: space-between;
			}

			.lamp {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--muted);
				box-shadow: 0 0 8px currentColor;
				flex: none;
			}

			.lamp.online {
				background: var(--cyan);
				color: var(--cyan);
			}

			.lamp.fault {
				background: var(--error);
				color: var(--error);
			}

			.deck-bar .name {
				color: var(--cyan);
			}

			.deck-bar .spacer {
				margin-left: auto;
			}

			.screen {
				padding: 0.9rem;
				min-height: 24rem;
			}

			/* ---- neon separator, as the deck draws it ---- */

			.sep {
				height: 7px;
				margin: 0.55rem 0;
				position: relative;
			}

			.sep::before,
			.sep::after {
				content: "";
				position: absolute;
				left: 0;
				right: 0;
				height: 1px;
			}

			.sep::before {
				top: 2px;
				background: rgba(49, 230, 223, 0.88);
				box-shadow: 0 -1px 0 rgba(49, 230, 223, 0.2);
			}

			.sep::after {
				top: 4px;
				background: rgba(255, 62, 181, 0.42);
			}

			/* ---- home: hero ---- */

			.hero {
				position: relative;
				height: 11rem;
				border: 1px solid rgba(49, 230, 223, 0.78);
				border-radius: 6px;
				overflow: hidden;
				display: flex;
				align-items: center;
				gap: 0.9rem;
				padding: 0 0.9rem;
			}

			.hero::before {
				content: "";
				position: absolute;
				inset: 0;
				background-image: url("/assets/rooftop.webp");
				background-size: cover;
				background-position: center 38%;
				opacity: 0.66;
			}

			.hero::after {
				content: "";
				position: absolute;
				inset: 0;
				background: rgba(7, 16, 23, 0.66);
			}

			.hero > * {
				position: relative;
				z-index: 1;
			}

			.hero img {
				width: 5.5rem;
				flex: none;
				filter: drop-shadow(0 0 12px rgba(49, 230, 223, 0.5));
			}

			.hero h1 {
				margin: 0;
				font-family: var(--mono);
				font-size: 1.6rem;
				letter-spacing: 0.2em;
				color: var(--cyan);
				text-shadow: 0 0 18px rgba(49, 230, 223, 0.55);
			}

			.hero p {
				margin: 0.3rem 0 0;
				font-family: var(--mono);
				font-size: 0.66rem;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--text);
				opacity: 0.75;
			}

			@media (max-width: 26rem) {
				.hero {
					height: 9rem;
				}

				.hero img {
					width: 3.6rem;
				}

				.hero h1 {
					font-size: 1.15rem;
				}
			}

			/* ---- home: news banner ---- */

			.banner {
				display: block;
				width: 100%;
				text-align: left;
				font: inherit;
				color: var(--text);
				background: var(--raised);
				border: 1px solid rgba(255, 62, 181, 0.5);
				border-left: 3px solid var(--magenta);
				border-radius: 4px;
				padding: 0.6rem 0.8rem;
				margin-bottom: 0.7rem;
				cursor: pointer;
			}

			.banner:hover,
			.banner:focus-visible {
				border-color: var(--magenta);
				box-shadow: 0 0 14px rgba(255, 62, 181, 0.25);
			}

			.banner .flag {
				font-family: var(--mono);
				font-size: 0.62rem;
				letter-spacing: 0.18em;
				text-transform: uppercase;
				color: var(--magenta);
			}

			.banner .headline {
				display: block;
				font-size: 0.92rem;
				margin-top: 0.15rem;
			}

			/* ---- home: tile grid ---- */

			.tiles {
				display: grid;
				gap: 0.55rem;
				grid-template-columns: repeat(2, 1fr);
			}

			@media (max-width: 26rem) {
				.tiles {
					grid-template-columns: 1fr;
				}
			}

			.tile {
				position: relative;
				display: flex;
				flex-direction: column;
				justify-content: flex-end;
				height: 8.25rem;
				padding: 0.7rem 0.8rem;
				border: 1px solid rgba(49, 230, 223, 0.35);
				border-radius: 5px;
				background: var(--raised);
				color: var(--text);
				font: inherit;
				text-align: left;
				cursor: pointer;
				overflow: hidden;
			}

			.tile.wide {
				grid-column: 1 / -1;
			}

			.tile .art {
				position: absolute;
				inset: 0;
				background-size: cover;
				background-position: center;
				opacity: 0.55;
				transition: opacity 120ms linear, transform 200ms ease;
			}

			.tile::after {
				content: "";
				position: absolute;
				inset: 0;
				background: linear-gradient(
					to top,
					rgba(7, 16, 23, 0.94) 0%,
					rgba(7, 16, 23, 0.55) 45%,
					rgba(7, 16, 23, 0.25) 100%
				);
			}

			.tile > .label,
			.tile > .telemetry {
				position: relative;
				z-index: 1;
			}

			.tile .label {
				font-family: var(--mono);
				font-size: 0.92rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--text);
			}

			.tile .telemetry {
				font-family: var(--mono);
				font-size: 0.64rem;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: var(--cyan);
				margin-top: 0.15rem;
			}

			.tile:hover,
			.tile:focus-visible {
				border-color: var(--cyan);
				box-shadow: 0 0 16px rgba(49, 230, 223, 0.3);
			}

			.tile:hover .art,
			.tile:focus-visible .art {
				opacity: 0.72;
				transform: scale(1.03);
			}

			.badge {
				position: absolute;
				top: 0.5rem;
				right: 0.55rem;
				z-index: 2;
				min-width: 1.3rem;
				height: 1.3rem;
				padding: 0 0.35rem;
				border-radius: 0.65rem;
				background: var(--magenta);
				color: #0a0410;
				font-family: var(--mono);
				font-size: 0.68rem;
				font-weight: 700;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			/* ---- view screens ---- */

			.viewbar {
				display: flex;
				align-items: center;
				gap: 0.7rem;
			}

			.back {
				font-family: var(--mono);
				font-size: 0.72rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--cyan);
				background: transparent;
				border: 1px solid var(--line);
				border-radius: 3px;
				padding: 0.3rem 0.6rem;
				cursor: pointer;
			}

			.back:hover,
			.back:focus-visible {
				border-color: var(--cyan);
				box-shadow: 0 0 12px rgba(49, 230, 223, 0.25);
			}

			.viewtitle {
				font-family: var(--mono);
				font-size: 0.76rem;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				color: var(--muted);
			}

			/* ---- content primitives ---- */

			.cards {
				display: grid;
				gap: 0.7rem;
				grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
			}

			.card {
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 4px;
				padding: 0.75rem 0.85rem 0.9rem;
			}

			.card img {
				display: block;
				width: 100%;
				aspect-ratio: 4 / 5;
				object-fit: cover;
				border-radius: 3px;
				margin-bottom: 0.65rem;
				background: var(--raised);
			}

			.card h3 {
				margin: 0;
				font-size: 1rem;
			}

			/*
				The crew reads as a directory rather than a gallery: a portrait
				beside the details, one profile per row. A bio and a fact list are
				taller than they are wide, so stacking them under a full-width
				portrait wastes the screen and pushes the third profile off it.
			*/
			.crewlist {
				display: flex;
				flex-direction: column;
				gap: 0.6rem;
			}

			.card.row {
				display: flex;
				align-items: flex-start;
				gap: 0.85rem;
			}

			.card.row img {
				width: 7.5rem;
				flex: none;
				margin-bottom: 0;
			}

			/* Without this the text column refuses to shrink and the row overflows. */
			.card.row .info {
				flex: 1;
				min-width: 0;
			}

			@media (max-width: 26rem) {
				.card.row img {
					width: 5.25rem;
				}

				.card.row .facts dt {
					min-width: 5rem;
				}
			}

			.grouplabel {
				font-family: var(--mono);
				font-size: 0.66rem;
				letter-spacing: 0.2em;
				text-transform: uppercase;
				color: var(--magenta);
				margin: 1.1rem 0 0.55rem;
			}

			.handle {
				font-family: var(--mono);
				font-size: 0.74rem;
				color: var(--cyan);
				margin: 0.1rem 0 0;
				word-break: break-word;
			}

			.role,
			.taste {
				font-family: var(--mono);
				font-size: 0.66rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				margin: 0.4rem 0 0;
			}

			.role {
				color: var(--muted);
			}

			.taste {
				color: var(--magenta);
			}

			.body {
				font-size: 0.88rem;
				margin: 0.55rem 0 0;
				color: #b9d4d1;
			}

			.ingredients {
				font-size: 0.78rem;
				font-style: italic;
				color: var(--muted);
				margin: 0.45rem 0 0;
			}

			.facts {
				margin: 0.55rem 0 0;
				font-size: 0.78rem;
				color: var(--muted);
			}

			.facts div {
				display: flex;
				gap: 0.5rem;
			}

			.facts dt {
				font-family: var(--mono);
				font-size: 0.64rem;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				min-width: 6rem;
				color: var(--line);
			}

			.facts dd {
				margin: 0;
			}

			.drinkhead {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: 0.7rem;
			}

			.price {
				font-family: var(--mono);
				font-size: 0.8rem;
				color: var(--amber);
				white-space: nowrap;
			}

			/* ---- broadcasts ---- */

			.post {
				background: var(--panel);
				border: 1px solid var(--line);
				border-left: 2px solid var(--cyan);
				border-radius: 4px;
				padding: 0.8rem 0.95rem 0.95rem;
				margin-bottom: 0.7rem;
			}

			.post.pinned {
				border-left-color: var(--amber);
			}

			.post h3 {
				margin: 0;
				font-size: 1.05rem;
			}

			.stamp {
				font-family: var(--mono);
				font-size: 0.66rem;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--muted);
				margin: 0.25rem 0 0;
			}

			.pin {
				color: var(--amber);
			}

			.prose {
				white-space: pre-wrap;
				font-size: 0.88rem;
				margin: 0.6rem 0 0;
			}

			.post img.flyer {
				display: block;
				width: 100%;
				max-width: 22rem;
				border-radius: 3px;
				margin-top: 0.7rem;
			}

			a.link {
				display: inline-block;
				margin-top: 0.7rem;
				font-family: var(--mono);
				font-size: 0.72rem;
				letter-spacing: 0.1em;
				color: var(--cyan);
			}

			/* ---- terminal lines (wi-fi, address) ---- */

			.termline {
				display: flex;
				align-items: center;
				gap: 0.6rem;
				flex-wrap: wrap;
				font-family: var(--mono);
				font-size: 0.82rem;
				background: var(--panel);
				border: 1px solid var(--line);
				border-radius: 3px;
				padding: 0.5rem 0.7rem;
				margin-bottom: 0.4rem;
			}

			.termline .key {
				font-size: 0.66rem;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				color: var(--muted);
			}

			.termline .value {
				color: var(--cyan);
				word-break: break-all;
			}

			.copy {
				margin-left: auto;
				font-family: var(--mono);
				font-size: 0.62rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--muted);
				background: transparent;
				border: 1px solid var(--line);
				border-radius: 3px;
				padding: 0.2rem 0.5rem;
				cursor: pointer;
			}

			.copy:hover,
			.copy:focus-visible {
				color: var(--cyan);
				border-color: var(--cyan);
			}

			.copy.done {
				color: var(--cyan);
				border-color: var(--cyan);
			}

			.heading {
				font-family: var(--mono);
				font-size: 0.78rem;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: var(--cyan);
				margin: 1rem 0 0.4rem;
			}

			.muted {
				color: var(--muted);
				font-size: 0.82rem;
				margin: 0.3rem 0 0;
			}

			ul.bullets {
				margin: 0.4rem 0 0;
				padding-left: 1.1rem;
				font-size: 0.88rem;
			}

			/* ---- markdown, styled as the deck styles it ---- */

			.heading.alt {
				color: var(--magenta);
			}

			.md strong {
				color: var(--cyan);
				font-weight: 600;
			}

			.md em {
				color: var(--amber);
				font-style: italic;
			}

			.md code {
				font-family: var(--mono);
				color: var(--magenta);
				cursor: pointer;
				border-bottom: 1px dotted rgba(255, 62, 181, 0.6);
			}

			.md code:hover,
			.md code:focus-visible {
				color: var(--text);
				background: rgba(255, 62, 181, 0.14);
			}

			.md code.copied {
				color: var(--cyan);
				border-bottom-color: var(--cyan);
			}

			.quote {
				display: flex;
				gap: 0.5rem;
				font-size: 0.88rem;
				margin: 0.4rem 0 0;
				color: var(--muted);
			}

			.quote::before {
				content: "|";
				color: var(--line);
				flex: none;
			}

			.ordered {
				display: flex;
				gap: 0.45rem;
				font-size: 0.88rem;
				margin: 0.3rem 0 0;
			}

			.ordered .marker {
				font-family: var(--mono);
				color: var(--amber);
				flex: none;
			}

			/* ---- states ---- */

			.status {
				font-family: var(--mono);
				font-size: 0.78rem;
				letter-spacing: 0.1em;
				color: var(--muted);
				text-align: center;
				padding: 4rem 1rem;
			}

			.status.error {
				color: var(--error);
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					transition: none !important;
					animation: none !important;
				}
			}
		</style>
	</head>

	<body>
		<div class="deck">
			<div class="deck-bar">
				<span class="lamp" id="lamp"></span>
				<span class="name">THE GRID</span>
				<span class="spacer" id="barstate">BOOTING</span>
			</div>

			<div class="screen" id="screen">
				<p class="status">Connecting to the relay&hellip;</p>
			</div>

			<div class="deck-foot">
				<span id="footleft">CYBERDECK // WEB</span>
				<span id="footright"></span>
			</div>
		</div>

		<script>
			(function () {
				"use strict";

				/**
				 * The Cyberdeck, as much of it as a browser can honestly be.
				 *
				 * The plugin is a tile grid that swaps one view into a single screen;
				 * this mirrors that rather than unrolling everything into a page, so
				 * the two read as the same device. What is missing is missing because
				 * it cannot work here: Network scans live game memory, Settings
				 * configures a plugin, and the activities are played in-game.
				 *
				 * Every node is built with createElement and textContent. The content
				 * is editor-authored and server-validated, but it is still stored text
				 * arriving over the network, so a stray angle bracket in a drink
				 * description renders as an angle bracket and never as markup.
				 */

				/**
				 * Values the deck keeps in its own configuration rather than in the
				 * catalogue, copied from PluginConfig.cs and CyberdeckWindow.cs.
				 *
				 * The Wi-Fi block is the fallback only. A published `wifi` page
				 * replaces that screen wholesale, exactly as it does in the plugin —
				 * which is the point of the page: these can change without a release.
				 */
				var DECK = {
					address: "Light Raiden Mist W2 P6",
					discord: "https://discord.gg/kxZMbP3C5B",
					relays: [
						{ name: "Lightless", id: "LLS-6AAKEJBAPRB0" },
						{ name: "PlayerSync", id: "n_root" }
					],
					rules: ["Please compress your textures.", "Please be SFW."]
				};

				var CREW_GROUPS = [
					{ key: "photography", label: "Visual Capture" },
					{ key: "dj", label: "Resident DJs" },
					{ key: "bar", label: "Bar Staff" }
				];

				var catalog = null;

				/* ---- small builders ---- */

				function el(tag, className, text) {
					var node = document.createElement(tag);
					if (className) {
						node.className = className;
					}
					if (text !== undefined && text !== null && text !== "") {
						node.textContent = text;
					}
					return node;
				}

				function sep() {
					return el("div", "sep");
				}

				function pad(value) {
					return (value < 10 ? "0" : "") + value;
				}

				/**
				 * Points a media URL at whichever host is serving this page.
				 *
				 * The catalogue hands out absolute URLs on the API hostname, but the
				 * same Worker serves /media on every hostname it answers. Rewriting to
				 * the current origin keeps the image CSP at 'self'.
				 */
				function sameOrigin(url) {
					if (typeof url !== "string" || url === "") {
						return "";
					}
					try {
						return location.origin + new URL(url, location.origin).pathname;
					} catch (error) {
						return "";
					}
				}

				function addImage(parent, url, alt, className) {
					var src = sameOrigin(url);
					if (src === "") {
						return;
					}
					var img = el("img", className);
					img.src = src;
					img.alt = alt || "";
					img.loading = "lazy";
					img.decoding = "async";
					img.addEventListener("error", function () {
						img.remove();
					});
					parent.appendChild(img);
				}

				function formatDate(value) {
					if (!value) {
						return "";
					}
					var parsed = new Date(value);
					if (isNaN(parsed.getTime())) {
						return "";
					}
					return parsed.toLocaleString(undefined, {
						dateStyle: "medium",
						timeStyle: "short"
					});
				}

				/** A copyable terminal line, as the deck draws it. */
				function termLine(key, value) {
					var row = el("div", "termline");
					row.appendChild(el("span", "key", key));
					row.appendChild(el("span", "value", value));

					var button = el("button", "copy", "Copy");
					button.type = "button";
					button.addEventListener("click", function () {
						var done = function () {
							button.textContent = "Copied";
							button.classList.add("done");
							setTimeout(function () {
								button.textContent = "Copy";
								button.classList.remove("done");
							}, 1400);
						};
						if (navigator.clipboard && navigator.clipboard.writeText) {
							navigator.clipboard.writeText(value).then(done, function () {
								button.textContent = "Copy failed";
							});
						} else {
							button.textContent = "Copy failed";
						}
					});
					row.appendChild(button);

					return row;
				}

				/**
				 * The same Markdown subset the plugin renders, with the same meanings.
				 *
				 * Transcribed from CyberdeckWindow.Markdown.cs: headings, bullets,
				 * numbered lists that keep the author's own numbering, blockquotes,
				 * horizontal rules, and inline strong / emphasis / code / links. The
				 * colours match too, because the page is written once and read in both
				 * places — the venue should not have to check which build it looks
				 * right in.
				 *
				 * Two behaviours are carried over deliberately. Code spans copy when
				 * clicked, which is how the syncshell ids are meant to be lifted off
				 * the screen. And links are https only, matching what the relay
				 * enforces on stored links; anything else stays inert text rather than
				 * becoming a clickable javascript: or data: URL.
				 */
				function renderMarkdown(source, into) {
					var INLINE =
						/`([^`]+)`|\*\*([^*]+)\*\*|\*([^*]+)\*|\[([^\]]+)\]\(([^)]+)\)|(https?:\/\/[^\s)]+)/g;

					var isSafeLink = function (href) {
						return /^https:\/\//i.test(String(href || ""));
					};

					var codeSpan = function (text) {
						var node = el("code", null, text);
						node.tabIndex = 0;
						node.title = "Click to copy";
						var copy = function () {
							if (!navigator.clipboard || !navigator.clipboard.writeText) {
								return;
							}
							navigator.clipboard.writeText(text).then(function () {
								node.classList.add("copied");
								setTimeout(function () {
									node.classList.remove("copied");
								}, 1400);
							});
						};
						node.addEventListener("click", copy);
						node.addEventListener("keydown", function (event) {
							if (event.key === "Enter" || event.key === " ") {
								event.preventDefault();
								copy();
							}
						});
						return node;
					};

					var anchor = function (label, href) {
						if (!isSafeLink(href)) {
							return document.createTextNode(label);
						}
						var node = el("a", "link", label);
						node.href = href;
						node.rel = "noopener noreferrer nofollow";
						node.target = "_blank";
						return node;
					};

					var inline = function (target, text) {
						var cursor = 0;
						var match;
						INLINE.lastIndex = 0;

						while ((match = INLINE.exec(text)) !== null) {
							if (match.index > cursor) {
								target.appendChild(document.createTextNode(text.slice(cursor, match.index)));
							}

							if (match[1] !== undefined) {
								target.appendChild(codeSpan(match[1]));
							} else if (match[2] !== undefined) {
								target.appendChild(el("strong", null, match[2]));
							} else if (match[3] !== undefined) {
								target.appendChild(el("em", null, match[3]));
							} else if (match[4] !== undefined) {
								target.appendChild(anchor(match[4], match[5]));
							} else {
								target.appendChild(anchor(match[6], match[6]));
							}

							cursor = match.index + match[0].length;
						}

						if (cursor < text.length) {
							target.appendChild(document.createTextNode(text.slice(cursor)));
						}
					};

					var block = el("div", "md");
					var list = null;

					String(source || "")
						.replace(/\r\n/g, "\n")
						.split("\n")
						.forEach(function (raw) {
							var line = raw.replace(/\s+$/, "");
							var trimmed = line.replace(/^\s+/, "");

							if (trimmed === "") {
								list = null;
								return;
							}

							if (trimmed === "---" || trimmed === "***" || trimmed === "___") {
								list = null;
								block.appendChild(sep());
								return;
							}

							// One to three hashes only, as the deck has it: h1 cyan, the
							// rest magenta.
							var heading = /^(#{1,3})\s+(.*)$/.exec(trimmed);
							if (heading) {
								list = null;
								block.appendChild(
									el("p", heading[1].length === 1 ? "heading" : "heading alt", heading[2].trim())
								);
								return;
							}

							var bullet = /^[-*]\s+(.*)$/.exec(trimmed);
							if (bullet) {
								if (list === null) {
									list = el("ul", "bullets");
									block.appendChild(list);
								}
								var item = el("li");
								inline(item, bullet[1].trim());
								list.appendChild(item);
								return;
							}

							list = null;

							// Numbered lists keep the author's numbering rather than
							// being renumbered.
							var ordered = /^(\d+\.)\s+(.*)$/.exec(trimmed);
							if (ordered) {
								var row = el("div", "ordered");
								row.appendChild(el("span", "marker", ordered[1]));
								var content = el("span");
								inline(content, ordered[2].trim());
								row.appendChild(content);
								block.appendChild(row);
								return;
							}

							var quote = /^>\s+(.*)$/.exec(trimmed);
							if (quote) {
								var quoted = el("div", "quote");
								var quoteBody = el("span");
								inline(quoteBody, quote[1].trim());
								quoted.appendChild(quoteBody);
								block.appendChild(quoted);
								return;
							}

							var paragraph = el("p", "body");
							inline(paragraph, trimmed);
							block.appendChild(paragraph);
						});

					into.appendChild(block);
				}

				/* ---- views ---- */

				function crewCard(profile) {
					var card = el("article", "card row");
					addImage(card, profile.imageUrl, profile.name);

					var info = el("div", "info");
					info.appendChild(el("h3", null, profile.name));

					if (profile.characterName) {
						info.appendChild(el("p", "handle", profile.characterName));
					}
					if (profile.occupation) {
						info.appendChild(el("p", "role", profile.occupation));
					}
					if (profile.genres) {
						info.appendChild(el("p", "taste", profile.genres));
					}
					if (profile.bio) {
						info.appendChild(el("p", "body", profile.bio));
					}

					var optional = profile.optional || {};
					var rows = [
						["Pronouns", optional.pronouns],
						["Race", optional.race],
						["Affiliation", profile.affiliation],
						["Available", optional.availability]
					].filter(function (pair) {
						return pair[1];
					});

					if (rows.length > 0) {
						var list = el("dl", "facts");
						rows.forEach(function (pair) {
							var row = el("div");
							row.appendChild(el("dt", null, pair[0]));
							row.appendChild(el("dd", null, pair[1]));
							list.appendChild(row);
						});
						info.appendChild(list);
					}

					card.appendChild(info);

					// requestLabel and requestMessage are deliberately not rendered.
					// They send an in-game /tell from the plugin; on the web they
					// would be a button that cannot do the one thing it names.
					return card;
				}

				function viewCrew(into) {
					var profiles = catalog.profiles || [];
					var placed = {};

					CREW_GROUPS.forEach(function (group) {
						var members = profiles.filter(function (profile) {
							return profile.category === group.key;
						});
						if (members.length === 0) {
							return;
						}
						members.forEach(function (profile) {
							placed[profile.id] = true;
						});

						into.appendChild(el("p", "grouplabel", group.label));
						var grid = el("div", "crewlist");
						members.forEach(function (profile) {
							grid.appendChild(crewCard(profile));
						});
						into.appendChild(grid);
					});

					// A category this build does not know about still shows, so adding
					// one in the admin panel never silently drops people.
					var rest = profiles.filter(function (profile) {
						return placed[profile.id] !== true;
					});
					if (rest.length > 0) {
						into.appendChild(el("p", "grouplabel", "Also On Shift"));
						var grid = el("div", "crewlist");
						rest.forEach(function (profile) {
							grid.appendChild(crewCard(profile));
						});
						into.appendChild(grid);
					}
				}

				function viewMenu(into) {
					var grid = el("div", "cards");

					(catalog.menu || []).forEach(function (item) {
						var card = el("article", "card");
						addImage(card, item.imageUrl, item.name);

						var head = el("div", "drinkhead");
						head.appendChild(el("h3", null, item.name));
						if (item.priceLabel) {
							head.appendChild(el("span", "price", item.priceLabel));
						}
						card.appendChild(head);

						if (item.taste) {
							card.appendChild(el("p", "taste", item.taste));
						}
						if (item.description) {
							card.appendChild(el("p", "body", item.description));
						}
						if (item.ingredients) {
							card.appendChild(el("p", "ingredients", item.ingredients));
						}

						grid.appendChild(card);
					});

					into.appendChild(grid);
				}

				function viewBroadcast(into) {
					(catalog.news || []).forEach(function (post) {
						var article = el("article", post.pinned ? "post pinned" : "post");
						article.appendChild(el("h3", null, post.title));

						var stamp = el("p", "stamp");
						if (post.pinned) {
							stamp.appendChild(el("span", "pin", "Pinned · "));
						}
						var when = post.eventAt ? formatDate(post.eventAt) : formatDate(post.publishedAt);
						if (when) {
							stamp.appendChild(
								document.createTextNode((post.eventAt ? "Event · " : "Posted · ") + when)
							);
						}
						article.appendChild(stamp);

						if (post.summary) {
							article.appendChild(el("p", "body", post.summary));
						}
						if (post.body) {
							article.appendChild(el("p", "prose", post.body));
						}

						addImage(article, post.flyerUrl, post.title, "flyer");

						if (post.link) {
							var link = el("a", "link", post.linkLabel || "Open link");
							link.href = post.link;
							link.rel = "noopener noreferrer nofollow";
							link.target = "_blank";
							article.appendChild(link);
						}

						into.appendChild(article);
					});
				}

				function discordLink() {
					var link = el("a", "link", "Discord");
					link.href = DECK.discord;
					link.rel = "noopener noreferrer nofollow";
					link.target = "_blank";
					return link;
				}

				function viewWifi(into) {
					// A published page replaces this screen wholesale, exactly as it
					// does in the plugin, so relay ids and house rules can change
					// without touching either build.
					var page = findPage("wifi");
					if (page) {
						renderMarkdown(page.body, into);
						into.appendChild(discordLink());
						return;
					}

					DECK.relays.forEach(function (relay) {
						into.appendChild(el("p", "heading", relay.name));
						into.appendChild(termLine("Id", relay.id));
						into.appendChild(el("p", "muted", "No password required"));
					});

					into.appendChild(sep());
					DECK.rules.forEach(function (rule) {
						into.appendChild(el("p", "body", rule));
					});
					into.appendChild(discordLink());
				}

				function viewAddress(into) {
					into.appendChild(el("p", "body", DECK.address));
					into.appendChild(termLine("Address", DECK.address));
					// The deck's other control here is a Lifestream teleport, which
					// only means anything inside the game, so it is not offered.
					into.appendChild(
						el("p", "muted", "Travel there in game, or copy the address for Lifestream.")
					);
				}

				/* ---- home ---- */

				function findPage(id) {
					return (catalog.pages || []).filter(function (page) {
						return page.id === id;
					})[0];
				}

				function addressTelemetry() {
					var segments = DECK.address.split(/\s+/).filter(Boolean);
					return segments.slice(Math.max(0, segments.length - 3)).join(" ").toUpperCase();
				}

				/**
				 * The tiles, in the plugin's own order. A tile with nothing behind it
				 * is left out rather than opening an empty screen.
				 */
				function tiles() {
					var menu = catalog.menu || [];
					var profiles = catalog.profiles || [];
					var news = catalog.news || [];
					var built = [];

					if (menu.length > 0) {
						built.push({
							id: "menu",
							label: "Menu",
							art: "menu",
							telemetry: pad(menu.length) + " ITEMS"
						});
					}

					built.push({
						id: "wifi",
						label: "Wi-Fi",
						art: "wifi",
						telemetry: pad(DECK.relays.length) + " RELAYS"
					});

					built.push({
						id: "address",
						label: "Address",
						art: "address",
						telemetry: addressTelemetry()
					});

					if (profiles.length > 0) {
						built.push({
							id: "crew",
							label: "Crew",
							art: "services",
							telemetry:
								pad(profiles.length) + (profiles.length === 1 ? " PROFILE" : " PROFILES")
						});
					}

					if (news.length > 0) {
						built.push({
							id: "broadcast",
							label: "Broadcast",
							art: "broadcast",
							telemetry: pad(news.length) + (news.length === 1 ? " POST" : " POSTS"),
							wide: true,
							badge: news.filter(function (post) {
								return post.pinned;
							}).length
						});
					}

					return built;
				}

				function tileButton(spec) {
					var button = el("button", spec.wide ? "tile wide" : "tile");
					button.type = "button";

					var art = el("div", "art");
					art.style.backgroundImage = 'url("/assets/' + spec.art + '.webp")';
					button.appendChild(art);

					if (spec.badge > 0) {
						button.appendChild(el("span", "badge", String(spec.badge)));
					}

					button.appendChild(el("span", "label", spec.label));
					button.appendChild(el("span", "telemetry", spec.telemetry));
					button.addEventListener("click", function () {
						go(spec.id);
					});

					return button;
				}

				function viewHome(into) {
					var hero = el("div", "hero");
					var logo = el("img");
					logo.src = "/assets/grid.webp";
					logo.alt = "";
					hero.appendChild(logo);

					var block = el("div");
					block.appendChild(el("h1", null, "THE GRID"));
					block.appendChild(el("p", null, "Eorzea · Raiden · " + addressTelemetry()));
					hero.appendChild(block);
					into.appendChild(hero);

					into.appendChild(sep());

					// The banner mirrors the deck's: the newest pinned post, promoted
					// to the home screen so it is seen without opening anything.
					var pinned = (catalog.news || []).filter(function (post) {
						return post.pinned;
					})[0];
					if (pinned) {
						var banner = el("button", "banner");
						banner.type = "button";
						banner.appendChild(el("span", "flag", "Broadcast"));
						banner.appendChild(el("span", "headline", pinned.title));
						banner.addEventListener("click", function () {
							go("broadcast");
						});
						into.appendChild(banner);
					}

					var grid = el("div", "tiles");
					tiles().forEach(function (spec) {
						grid.appendChild(tileButton(spec));
					});
					into.appendChild(grid);
				}

				/* ---- routing ---- */

				var VIEWS = {
					menu: { title: "Menu", render: viewMenu },
					wifi: { title: "Wi-Fi / Syncshell", render: viewWifi },
					address: { title: "Address", render: viewAddress },
					crew: { title: "The Crew", render: viewCrew },
					broadcast: { title: "Broadcast", render: viewBroadcast }
				};

				function go(id) {
					// Through the hash, so the browser's own back button walks the
					// deck's screens instead of leaving the site.
					location.hash = id ? "#" + id : "";
				}

				function currentView() {
					var id = location.hash.replace(/^#/, "");
					return Object.hasOwn(VIEWS, id) ? id : "";
				}

				function paint() {
					if (catalog === null) {
						return;
					}

					var screen = document.getElementById("screen");
					screen.textContent = "";

					var id = currentView();
					if (id === "") {
						viewHome(screen);
						document.getElementById("barstate").textContent = "HOME";
						return;
					}

					var view = VIEWS[id];
					var bar = el("div", "viewbar");
					var back = el("button", "back", "< HOME");
					back.type = "button";
					back.addEventListener("click", function () {
						go("");
					});
					bar.appendChild(back);
					bar.appendChild(el("span", "viewtitle", "// " + view.title.toUpperCase()));
					screen.appendChild(bar);
					screen.appendChild(sep());

					var content = el("div");
					view.render(content);
					screen.appendChild(content);

					document.getElementById("barstate").textContent = view.title.toUpperCase();
					screen.scrollIntoView({ block: "start", behavior: "auto" });
				}

				window.addEventListener("hashchange", paint);

				/* ---- boot ---- */

				function fault(message) {
					var screen = document.getElementById("screen");
					screen.textContent = "";
					screen.appendChild(el("p", "status error", message));
					document.getElementById("lamp").className = "lamp fault";
					document.getElementById("barstate").textContent = "OFFLINE";
				}

				fetch("/v1/catalog", { headers: { accept: "application/json" } })
					.then(function (response) {
						if (response.status === 429) {
							throw new Error("busy");
						}
						if (!response.ok) {
							throw new Error("http " + response.status);
						}
						return response.json();
					})
					.then(function (data) {
						catalog = data;
						document.getElementById("lamp").className = "lamp online";
						document.getElementById("footleft").textContent = "RELAY // ONLINE";
						var updated = formatDate(data.updatedAt);
						document.getElementById("footright").textContent = updated
							? "SYNC " + updated
							: "";
						paint();
					})
					.catch(function (error) {
						fault(
							error && error.message === "busy"
								? "Relay busy. Try again in a minute."
								: "Relay unreachable. Try again shortly."
						);
					});
			})();
		</script>
	</body>
</html>
